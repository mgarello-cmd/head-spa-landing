<style>
*,*::before,*::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --ink: #171714;
  --ink-60: rgba(23,23,20,.6);
  --cream: #FDFBF7;
  --bronze: #A8895A;
}

body {
  font-family: 'Jost', sans-serif;
  font-weight: 300;
  background: var(--cream);
  color: var(--ink);
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px;
}

.box {
  text-align: center;
  max-width: 440px;
}

.brand {
  font-family: 'Playfair Display', serif;
  font-size: .8rem;
  font-weight: 400;
  letter-spacing: .2em;
  text-transform: uppercase;
  color: var(--bronze);
  margin-bottom: 32px;
}

.divider {
  width: 32px;
  height: 1px;
  background: var(--bronze);
  margin: 0 auto 24px;
}

h1 {
  font-family: 'Playfair Display', serif;
  font-weight: 300;
  font-size: 1.7rem;
  margin-bottom: 14px;
  line-height: 1.25;
}
h1 em { font-style: italic; color: var(--bronze); }

.note {
  font-size: .92rem;
  color: var(--ink-60);
  line-height: 1.7;
  margin-bottom: 28px;
}

.redirect-note {
  font-size: .68rem;
  letter-spacing: .15em;
  text-transform: uppercase;
  color: var(--ink-60);
  margin-bottom: 14px;
}

.progress-bar {
  width: 180px;
  height: 1px;
  background: rgba(168,137,90,.15);
  margin: 0 auto 28px;
  overflow: hidden;
}
.progress-bar::after {
  content: '';
  display: block;
  height: 100%;
  background: var(--bronze);
  width: 0;
  animation: fill 4s linear forwards;
}
@keyframes fill { to { width: 100%; } }

.manual-link {
  display: inline-block;
  font-size: .68rem;
  font-weight: 500;
  letter-spacing: .18em;
  text-transform: uppercase;
  color: var(--bronze);
  text-decoration: none;
  border-bottom: 1px solid var(--bronze);
  padding-bottom: 3px;
}
</style>

<body>

<div class="box">
  <div class="brand">Head Spa Systems</div>
  <div class="divider"></div>
  <h1>Tu acceso <em>está listo</em></h1>
  <p class="note">En unos segundos abrimos la presentación del programa. También te enviamos el link por email.</p>
  <div class="redirect-note">Abriendo presentación en 4 segundos</div>
  <div class="progress-bar"></div>
  <a href="/clase.html" class="manual-link">Abrir ahora →</a>
</div>

<script>
setTimeout(() => {
  window.location.href = '/clase.html';
}, 4000);
</script>
